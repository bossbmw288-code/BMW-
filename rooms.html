<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرف الصوت والشات الكتابي</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 { color: #00adb5; margin: 5px 0; font-size: 20px; }
        .room-card {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #333;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .room-status { color: #28a745; font-size: 13px; margin-bottom: 8px; }
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .control-btn { background-color: #333; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        
        .chat-container {
            background-color: #1e1e1e;
            border-radius: 15px;
            border: 1px solid #333;
            width: 100%;
            max-width: 400px;
            flex-grow: 1;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: right;
        }
        .message {
            background-color: #252525;
            padding: 10px;
            border-radius: 10px;
            max-width: 85%;
            align-self: flex-start;
            font-size: 15px;
        }
        .my-message {
            background-color: #00adb5;
            color: white;
            align-self: flex-end;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            background-color: #151515;
            gap: 8px;
        }
        .chat-input {
            flex-grow: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #333;
            background-color: #252525;
            color: white;
            outline: none;
            font-size: 15px;
        }
        .send-btn {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>🎙️ غرف الصوت والمحادثة المباشرة</h2>
    
    <div class="room-card">
        <h3>غرفة الأصدقاء العامة 💬</h3>
        <div class="room-status">🟢 نشط الآن (أنت و 5 مستخدمين)</div>
        <div class="controls">
            <button class="control-btn" onclick="alert('تم كتم الميكروفون')">🎙️ كتم</button>
            <button class="control-btn" onclick="alert('تم إيقاف الكاميرا')">📷 كاميرا</button>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chatBox">
            <div class="message"><b>أحمد:</b> أهلاً بكم في الغرفة يا شباب! 👋</div>
            <div class="message"><b>سارة:</b> حياكم الله، الصوت واضح جداً رائع.</div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="msgInput" class="chat-input" placeholder="اكتب رسالتك هنا...">
            <button class="send-btn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            var input = document.getElementById('msgInput');
            var text = input.value;
            
            if(text.trim() !== "") {
                var chatBox = document.getElementById('chatBox');
                
                var newMsg = document.createElement('div');
                newMsg.className = 'message my-message';
                newMsg.innerHTML = "<b>أنت:</b> " + text;
                
                chatBox.appendChild(newMsg);
                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>

</body>
</html>
