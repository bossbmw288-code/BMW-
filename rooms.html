<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرف الصوت والفيديو</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #00adb5; text-align: center; }
        .rooms-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }
        .room-card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #333;
            text-align: center;
        }
        .room-status { color: #28a745; font-size: 14px; margin-bottom: 10px; }
        .controls { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .control-btn { background-color: #333; color: white; border: none; padding: 10px 15px; border-radius: 10px; cursor: pointer; }
        .join-btn {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>🎙️ غرف الصوت والفيديو المباشرة</h2>
    <p>اختر غرفة للانضمام إلى المحادثة المباشرة</p>
    <div class="rooms-grid">
        <div class="room-card">
            <h3>غرفة الأصدقاء العامة 💬</h3>
            <div class="room-status">🟢 نشط الآن (5 مستخدمين)</div>
            <div class="controls">
                <button class="control-btn" onclick="alert('تم كتم الميكروفون')">🎙️ كتم</button>
                <button class="control-btn" onclick="alert('تم إيقاف الكاميرا')">📷 كاميرا</button>
            </div>
            <button class="join-btn" onclick="alert('جاري الاتصال بالخدمة السحابية للغرفة...')">دخول الغرفة</button>
        </div>
    </div>
</body>
</html
