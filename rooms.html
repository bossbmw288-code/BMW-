<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة المحادثة والصوت والفيديو</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 10px; margin: 0; }
        .video-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px; }
        .video-box { width: 140px; height: 140px; background: #222; border-radius: 10px; overflow: hidden; border: 2px solid #00ffa3; }
        button { background: #00ffa3; color: black; border: none; padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 5px; cursor: pointer; margin: 5px; }
        #chatBox { height: 200px; border: 1px solid #333; background: #1a1a1a; overflow-y: auto; margin-top: 20px; padding: 10px; text-align: right; border-radius: 8px; }
        .message { margin-bottom: 8px; font-size: 14px; }
        .chat-input-area { display: flex; gap: 5px; margin-top: 10px; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: white; }
    </style>
</head>
<body>

    <h2>غرفة البث المباشر والدردشة</h2>
    
    <button id="join-btn">انضمام للغرفة (صوت وصورة)</button>
    <button id="leave-btn" style="background:#ff3b30; color:white; display:none;">مغادرة</button>

    <div class="video-container" id="video-streams"></div>

    <div id="chatBox">
        <div class="message"><b>أحمد:</b> أهلاً بك!</div>
        <div class="message"><b>سارة:</b> مرحباً جميعاً</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا...">
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <script src="https://agora.io"></script>
    
    <script>
        const APP_ID = "79d0ac03afbf4f25b72b6d348069f03f"; 
        const CHANNEL = "main_room"; 
        const TOKEN = null;

        let client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
        let localTracks = [];
        let remoteUsers = {};

        document.getElementById('join-btn').onclick = async () => {
            await client.join(APP_ID, CHANNEL, TOKEN, null);
            localTracks = await AgoraRTC.createMicrophoneAndCameraTracks();

            let player = `<div class="video-box" id="user-local"></div>`;
            document.getElementById('video-streams').insertAdjacentHTML('beforeend', player);
            localTracks.play('user-local');
            
            await client.publish([localTracks, localTracks]);

            document.getElementById('join-btn').style.display = 'none';
            document.getElementById('leave-btn').style.display = 'inline-block';
        };

        client.on('user-published', async (user, mediaType) => {
            remoteUsers[user.uid] = user;
            await client.subscribe(user, mediaType);

            if (mediaType === 'video') {
                let player = document.getElementById(`user-${user.uid}`);
                if (player) player.remove();

                player = `<div class="video-box" id="user-${user.uid}"></div>`;
                document.getElementById('video-streams').insertAdjacentHTML('beforeend', player);
                user.videoTrack.play(`user-${user.uid}`);
            }

            if (mediaType === 'audio') {
                user.audioTrack.play();
            }
        });

        client.on('user-unpublished', user => {
            let player = document.getElementById(`user-${user.uid}`);
            if (player) player.remove();
        });

        document.getElementById('leave-btn').onclick = async () => {
            for (let track of localTracks) {
                track.stop();
                track.close();
            }
            await client.leave();
            document.getElementById('video-streams').innerHTML = '';
            document.getElementById('join-btn').style.display = 'inline-block';
            document.getElementById('leave-btn').style.display = 'none';
        };

        function sendMessage() {
            var input = document.getElementById("msgInput");
            var text = input.value;

            if(text.trim() !== "") {
                var chatBox = document.getElementById("chatBox");
                var newMsg = document.createElement("div");
                newMsg.className = 'message';
                newMsg.innerHTML = "<b>أنت:</b> " + text;
                
                chatBox.appendChild(newMsg);
                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
