DOCTYPE html>
<index.html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المحادثة والصوت</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 80%;
            max-width: 400px;
        }
        h1 { color: #00adb5; font-size: 24px; }
        p { color: #eeeeee; font-size: 16px; }
        .btn {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مرحباً بك في تطبيقك الجديد! 💬🎙️</h1>
        <p>منصة غرف الدردشة، الصوت، والفيديو الخاصة بك جاهزة للتطوير.</p>
        <button class="btn" onclick="window.location.href='rooms.html'">دخول إلى الغرف</button>
    </div>

</.html>
